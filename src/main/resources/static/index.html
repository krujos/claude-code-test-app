<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gulf Racing - Account Management</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/libphonenumber-js@1.10.53/bundle/libphonenumber-min.js"></script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&loading=async&callback=initMap"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Archivo:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gulf-blue: #1A4C8B;
            --gulf-light-blue: #65C5F1;
            --gulf-orange: #FF6B35;
            --gulf-dark: #0D2847;
            --racing-white: #F8F9FA;
            --checkered: #1A1A1A;
            --error-red: #e74c3c;
        }

        body {
            font-family: 'Archivo', sans-serif;
            background: linear-gradient(135deg, var(--gulf-dark) 0%, var(--gulf-blue) 100%);
            min-height: 100vh;
            color: var(--racing-white);
            overflow-x: hidden;
        }

        /* Checkered flag pattern background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image:
                linear-gradient(45deg, var(--checkered) 25%, transparent 25%),
                linear-gradient(-45deg, var(--checkered) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--checkered) 75%),
                linear-gradient(-45deg, transparent 75%, var(--checkered) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Racing Sans One', cursive;
            font-size: 4rem;
            background: linear-gradient(135deg, var(--gulf-light-blue), var(--gulf-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 107, 53, 0.3);
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }

        .tagline {
            font-size: 1.2rem;
            color: var(--gulf-light-blue);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .racing-stripe {
            height: 6px;
            background: linear-gradient(90deg,
                var(--gulf-blue) 0%,
                var(--gulf-light-blue) 25%,
                var(--gulf-orange) 50%,
                var(--gulf-light-blue) 75%,
                var(--gulf-blue) 100%
            );
            margin: 2rem 0;
            border-radius: 3px;
            box-shadow: 0 0 20px rgba(101, 197, 241, 0.5);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                inset 0 -3px 0 var(--gulf-orange);
            color: var(--gulf-dark);
            animation: fadeInUp 0.6s ease-out;
            border: 3px solid var(--gulf-blue);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .phone-input-group {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: var(--gulf-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 1rem;
            border: 3px solid var(--gulf-blue);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Archivo', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--gulf-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
            transform: translateY(-2px);
        }

        input.error {
            border-color: var(--error-red);
            background: #ffe6e6;
        }

        .field-error {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-error::before {
            content: '⚠';
            font-size: 1.2rem;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Racing Sans One', cursive;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gulf-orange) 0%, #FF8C5A 100%);
            color: white;
            border: 3px solid var(--gulf-orange);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--gulf-blue) 0%, var(--gulf-light-blue) 100%);
            color: white;
            border: 3px solid var(--gulf-blue);
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(26, 76, 139, 0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .account-list {
            display: grid;
            gap: 1rem;
        }

        .account-item {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            border-left: 6px solid var(--gulf-orange);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .account-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }

        .account-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--gulf-blue);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.1rem;
            color: var(--gulf-dark);
            font-weight: 400;
        }

        .tab-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid transparent;
            border-radius: 12px;
            color: var(--racing-white);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab.active {
            background: var(--gulf-orange);
            border-color: var(--gulf-orange);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        .success-message {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-align: center;
            animation: slideDown 0.5s ease-out;
            border: 3px solid #27ae60;
        }

        .error-message {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-align: center;
            animation: slideDown 0.5s ease-out;
            border: 3px solid #c0392b;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .edit-mode {
            border-left-color: var(--gulf-light-blue);
            background: #f0f8ff;
        }

        .country-dropdown {
            position: relative;
            width: 100%;
        }

        .country-dropdown-button {
            width: 100%;
            padding: 1rem;
            border: 3px solid var(--gulf-blue);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Archivo', sans-serif;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .country-dropdown-button:hover {
            border-color: var(--gulf-orange);
        }

        .country-dropdown-button:focus {
            outline: none;
            border-color: var(--gulf-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .country-dropdown-button::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--gulf-blue);
        }

        .country-dropdown-menu {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: white;
            border: 3px solid var(--gulf-blue);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .country-dropdown-item {
            padding: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }

        .country-dropdown-item:last-child {
            border-bottom: none;
        }

        .country-dropdown-item:hover {
            background: rgba(255, 107, 53, 0.1);
        }

        .country-dropdown-item.selected {
            background: rgba(26, 76, 139, 0.1);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .phone-input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Callback for Google Maps API
        window.initMap = function() {
            window.googleMapsLoaded = true;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { parsePhoneNumber, AsYouType } = window.libphonenumber;

        // Common countries with their calling codes and example formats
        const COUNTRIES = [
            { code: 'US', name: 'United States', flag: '🇺🇸', callingCode: '+1', placeholder: '(201) 555-0123' },
            { code: 'CA', name: 'Canada', flag: '🇨🇦', callingCode: '+1', placeholder: '(204) 555-0123' },
            { code: 'GB', name: 'United Kingdom', flag: '🇬🇧', callingCode: '+44', placeholder: '020 7123 4567' },
            { code: 'DE', name: 'Germany', flag: '🇩🇪', callingCode: '+49', placeholder: '030 12345678' },
            { code: 'FR', name: 'France', flag: '🇫🇷', callingCode: '+33', placeholder: '01 23 45 67 89' },
            { code: 'IT', name: 'Italy', flag: '🇮🇹', callingCode: '+39', placeholder: '02 1234 5678' },
            { code: 'ES', name: 'Spain', flag: '🇪🇸', callingCode: '+34', placeholder: '912 34 56 78' },
            { code: 'MX', name: 'Mexico', flag: '🇲🇽', callingCode: '+52', placeholder: '55 1234 5678' },
            { code: 'JP', name: 'Japan', flag: '🇯🇵', callingCode: '+81', placeholder: '03-1234-5678' },
            { code: 'AU', name: 'Australia', flag: '🇦🇺', callingCode: '+61', placeholder: '02 1234 5678' },
        ];

        function CountryDropdown({ value, onChange }) {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            const selectedCountry = COUNTRIES.find(c => c.code === value) || COUNTRIES[0];

            // Close dropdown when clicking outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };

                if (isOpen) {
                    document.addEventListener('mousedown', handleClickOutside);
                    return () => document.removeEventListener('mousedown', handleClickOutside);
                }
            }, [isOpen]);

            const handleSelect = (countryCode) => {
                onChange(countryCode);
                setIsOpen(false);
            };

            return (
                <div className="country-dropdown" ref={dropdownRef}>
                    <button
                        type="button"
                        className="country-dropdown-button"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        {selectedCountry.callingCode}
                    </button>
                    {isOpen && (
                        <div className="country-dropdown-menu">
                            {COUNTRIES.map(country => (
                                <div
                                    key={country.code}
                                    className={`country-dropdown-item ${country.code === value ? 'selected' : ''}`}
                                    onClick={() => handleSelect(country.code)}
                                >
                                    {country.flag} {country.name} ({country.callingCode})
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function PhoneInput({ value, onChange, country, onCountryChange, error, setError }) {
            const [displayValue, setDisplayValue] = useState('');

            useEffect(() => {
                // Initialize display value when value changes from outside
                if (value && !displayValue) {
                    setDisplayValue(value);
                }
            }, [value]);

            const formatPhoneNumber = (input, countryCode) => {
                try {
                    const formatter = new AsYouType(countryCode);
                    const formatted = formatter.input(input);
                    return formatted;
                } catch (e) {
                    return input;
                }
            };

            const validatePhoneNumber = (phoneNumber, countryCode) => {
                // Empty phone numbers should allow typing but not try to convert
                if (!phoneNumber || phoneNumber.trim().length === 0) {
                    return { isValid: false, error: null, isEmpty: true };
                }

                try {
                    const parsed = parsePhoneNumber(phoneNumber, countryCode);
                    if (parsed && parsed.isValid()) {
                        return { isValid: true, error: null, isEmpty: false };
                    } else {
                        return {
                            isValid: false,
                            error: `Invalid ${COUNTRIES.find(c => c.code === countryCode)?.name || countryCode} phone number format`,
                            isEmpty: false
                        };
                    }
                } catch (e) {
                    const country = COUNTRIES.find(c => c.code === countryCode);
                    const placeholder = country ? country.placeholder : '';
                    return {
                        isValid: false,
                        error: `Invalid phone number. Expected format: ${placeholder}`,
                        isEmpty: false
                    };
                }
            };

            const handlePhoneChange = (e) => {
                const input = e.target.value;

                // Extract only digits from the input
                const digitsOnly = input.replace(/\D/g, '');

                // Format as user types
                const formatted = formatPhoneNumber(digitsOnly, country);
                setDisplayValue(formatted);

                // Validate the digits only
                const validation = validatePhoneNumber(digitsOnly, country);

                // Handle empty phone numbers - just store as-is
                if (validation.isEmpty) {
                    setError(null);
                    onChange(formatted);
                    return;
                }

                if (validation.isValid) {
                    setError(null);
                    // Store in international format for backend
                    try {
                        const parsed = parsePhoneNumber(formatted, country);
                        if (parsed && parsed.isValid()) {
                            // Send international format to backend (e.g., "+1 212 456 7890")
                            const international = parsed.format('INTERNATIONAL');
                            onChange(international);
                        } else {
                            onChange(formatted);
                        }
                    } catch (e) {
                        onChange(formatted);
                    }
                } else {
                    setError(validation.error);
                    // Still update the value so user can see what they're typing
                    onChange(formatted);
                }
            };

            const handleCountryChange = (newCountry) => {
                onCountryChange(newCountry);

                // Re-validate with new country and update international format
                if (displayValue) {
                    const validation = validatePhoneNumber(displayValue, newCountry);
                    setError(validation.error);

                    // Update the stored value to international format
                    if (validation.isValid) {
                        try {
                            const parsed = parsePhoneNumber(displayValue, newCountry);
                            if (parsed && parsed.isValid()) {
                                onChange(parsed.format('INTERNATIONAL'));
                            }
                        } catch (e) {
                            // Keep current value if parsing fails
                        }
                    }
                }
            };

            const getPlaceholder = () => {
                const countryData = COUNTRIES.find(c => c.code === country);
                return countryData ? countryData.placeholder : '(###) ###-####';
            };

            return (
                <div className="phone-input-group">
                    <div className="form-group" style={{marginBottom: 0}}>
                        <label>Country</label>
                        <CountryDropdown value={country} onChange={handleCountryChange} />
                    </div>
                    <div className="form-group" style={{marginBottom: 0}}>
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            value={displayValue}
                            onChange={handlePhoneChange}
                            placeholder={getPlaceholder()}
                            className={error ? 'error' : ''}
                            required
                        />
                    </div>
                </div>
            );
        }

        function AddressAutocomplete({ value, onChange }) {
            const inputRef = useRef(null);
            const autocompleteRef = useRef(null);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                // Wait for Google Maps to load
                const checkGoogleMaps = () => {
                    if (window.google && window.google.maps && window.google.maps.places) {
                        setIsLoaded(true);
                    } else {
                        setTimeout(checkGoogleMaps, 100);
                    }
                };
                checkGoogleMaps();
            }, []);

            useEffect(() => {
                if (!inputRef.current || !isLoaded || !window.google) return;

                // Initialize Google Places Autocomplete
                autocompleteRef.current = new window.google.maps.places.Autocomplete(
                    inputRef.current,
                    {
                        types: ['address'],
                        fields: ['formatted_address', 'address_components', 'geometry']
                    }
                );

                // Listen for place selection
                autocompleteRef.current.addListener('place_changed', () => {
                    const place = autocompleteRef.current.getPlace();
                    if (place.formatted_address) {
                        onChange(place.formatted_address);
                    }
                });

                return () => {
                    if (autocompleteRef.current) {
                        window.google.maps.event.clearInstanceListeners(autocompleteRef.current);
                    }
                };
            }, [isLoaded]);

            // Update input value when value prop changes
            useEffect(() => {
                if (inputRef.current && value !== inputRef.current.value) {
                    inputRef.current.value = value;
                }
            }, [value]);

            const handleChange = (e) => {
                onChange(e.target.value);
            };

            return (
                <input
                    ref={inputRef}
                    type="text"
                    value={value}
                    onChange={handleChange}
                    placeholder="Start typing an address..."
                    required
                />
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('create');
            const [formData, setFormData] = useState({
                firstName: '',
                lastName: '',
                phoneNumber: '',
                address: '',
                apartmentNumber: ''
            });
            const [country, setCountry] = useState('US');
            const [phoneError, setPhoneError] = useState(null);
            const [adminPassword, setAdminPassword] = useState('');
            const [accounts, setAccounts] = useState([]);
            const [message, setMessage] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [editingId, setEditingId] = useState(null);

            // SSE for live updates
            useEffect(() => {
                const eventSource = new EventSource('/api/accounts/stream');

                eventSource.onmessage = (event) => {
                    const account = JSON.parse(event.data);
                    console.log('Received account:', account);
                };

                eventSource.onerror = (error) => {
                    console.log('SSE Error:', error);
                    eventSource.close();
                };

                return () => eventSource.close();
            }, []);

            const handleInputChange = (e) => {
                setFormData(prevFormData => ({
                    ...prevFormData,
                    [e.target.name]: e.target.value
                }));
            };

            const handlePhoneChange = (value) => {
                setFormData(prevFormData => ({
                    ...prevFormData,
                    phoneNumber: value
                }));
            };

            const createAccount = async (e) => {
                e.preventDefault();

                // Final validation before submit
                if (phoneError) {
                    setMessage({ type: 'error', text: 'Please fix phone number errors before submitting' });
                    setTimeout(() => setMessage(null), 5000);
                    return;
                }

                // Check for empty phone number
                if (!formData.phoneNumber || formData.phoneNumber.trim() === '') {
                    setMessage({ type: 'error', text: 'Phone number is required' });
                    setTimeout(() => setMessage(null), 5000);
                    return;
                }

                try {
                    const response = await fetch('/api/accounts', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        const newAccount = await response.json();
                        setMessage({ type: 'success', text: `Account created successfully! ID: ${newAccount.id}` });
                        setFormData({
                            firstName: '',
                            lastName: '',
                            phoneNumber: '',
                            address: '',
                            apartmentNumber: ''
                        });
                        setPhoneError(null);
                    } else {
                        const errorText = await response.text();
                        setMessage({ type: 'error', text: 'Failed to create account: ' + errorText });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Error: ' + error.message });
                }

                setTimeout(() => setMessage(null), 5000);
            };

            const loginAdmin = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('/api/admin/accounts', {
                        headers: {
                            'Authorization': 'Basic ' + btoa('admin:' + adminPassword)
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setAccounts(data);
                        setIsAuthenticated(true);
                        setMessage({ type: 'success', text: 'Login successful!' });
                    } else {
                        setMessage({ type: 'error', text: 'Invalid password' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Login failed: ' + error.message });
                }

                setTimeout(() => setMessage(null), 3000);
            };

            const updateAccount = async (id) => {
                if (phoneError) {
                    setMessage({ type: 'error', text: 'Please fix phone number errors before updating' });
                    setTimeout(() => setMessage(null), 5000);
                    return;
                }

                try {
                    const response = await fetch(`/api/admin/accounts/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Basic ' + btoa('admin:' + adminPassword),
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        const updatedAccount = await response.json();
                        setAccounts(accounts.map(acc => acc.id === id ? updatedAccount : acc));
                        setEditingId(null);
                        setFormData({
                            firstName: '',
                            lastName: '',
                            phoneNumber: '',
                            address: '',
                            apartmentNumber: ''
                        });
                        setPhoneError(null);
                        setMessage({ type: 'success', text: 'Account updated successfully!' });
                    } else {
                        const errorText = await response.text();
                        setMessage({ type: 'error', text: 'Update failed: ' + errorText });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Update failed: ' + error.message });
                }

                setTimeout(() => setMessage(null), 3000);
            };

            const deleteAccount = async (id) => {
                if (!confirm('Are you sure you want to delete this account?')) return;

                try {
                    const response = await fetch(`/api/admin/accounts/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': 'Basic ' + btoa('admin:' + adminPassword)
                        }
                    });

                    if (response.ok) {
                        setAccounts(accounts.filter(acc => acc.id !== id));
                        setMessage({ type: 'success', text: 'Account deleted successfully!' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Delete failed: ' + error.message });
                }

                setTimeout(() => setMessage(null), 3000);
            };

            const startEdit = (account) => {
                setEditingId(account.id);
                setFormData({
                    firstName: account.firstName,
                    lastName: account.lastName,
                    phoneNumber: account.phoneNumber,
                    address: account.address,
                    apartmentNumber: account.apartmentNumber || ''
                });
                setPhoneError(null);
            };

            const cancelEdit = () => {
                setEditingId(null);
                setFormData({
                    firstName: '',
                    lastName: '',
                    phoneNumber: '',
                    address: '',
                    apartmentNumber: ''
                });
                setPhoneError(null);
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="logo">GULF RACING</div>
                        <div className="tagline">Account Management System</div>
                    </div>

                    <div className="racing-stripe"></div>

                    <div className="tab-container">
                        <div
                            className={`tab ${activeTab === 'create' ? 'active' : ''}`}
                            onClick={() => setActiveTab('create')}
                        >
                            Create Account
                        </div>
                        <div
                            className={`tab ${activeTab === 'admin' ? 'active' : ''}`}
                            onClick={() => setActiveTab('admin')}
                        >
                            Admin Dashboard
                        </div>
                    </div>

                    {message && (
                        <div className={message.type === 'success' ? 'success-message' : 'error-message'}>
                            {message.text}
                        </div>
                    )}

                    {activeTab === 'create' && (
                        <div className="card">
                            <h2 style={{marginBottom: '1.5rem', color: 'var(--gulf-blue)', fontFamily: "'Racing Sans One', cursive"}}>
                                Register Your Account
                            </h2>
                            <form onSubmit={createAccount}>
                                <div className="form-group">
                                    <label>First Name</label>
                                    <input
                                        type="text"
                                        name="firstName"
                                        value={formData.firstName}
                                        onChange={handleInputChange}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Last Name</label>
                                    <input
                                        type="text"
                                        name="lastName"
                                        value={formData.lastName}
                                        onChange={handleInputChange}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <PhoneInput
                                        value={formData.phoneNumber}
                                        onChange={handlePhoneChange}
                                        country={country}
                                        onCountryChange={setCountry}
                                        error={phoneError}
                                        setError={setPhoneError}
                                    />
                                    {phoneError && (
                                        <div className="field-error">{phoneError}</div>
                                    )}
                                </div>
                                <div className="form-group">
                                    <label>Address</label>
                                    <AddressAutocomplete
                                        value={formData.address}
                                        onChange={(address) => setFormData(prevFormData => ({...prevFormData, address}))}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Apartment / Unit # (optional)</label>
                                    <input
                                        type="text"
                                        name="apartmentNumber"
                                        value={formData.apartmentNumber}
                                        onChange={handleInputChange}
                                        placeholder="e.g., Apt 4B, Unit 202"
                                    />
                                </div>
                                <button type="submit" className="btn btn-primary" disabled={phoneError !== null}>
                                    Create Account
                                </button>
                            </form>
                        </div>
                    )}

                    {activeTab === 'admin' && (
                        <div className="card">
                            {!isAuthenticated ? (
                                <>
                                    <h2 style={{marginBottom: '1.5rem', color: 'var(--gulf-blue)', fontFamily: "'Racing Sans One', cursive"}}>
                                        Admin Login
                                    </h2>
                                    <form onSubmit={loginAdmin}>
                                        <div className="form-group">
                                            <label>Password</label>
                                            <input
                                                type="password"
                                                value={adminPassword}
                                                onChange={(e) => setAdminPassword(e.target.value)}
                                                required
                                                placeholder="Enter admin password"
                                            />
                                        </div>
                                        <button type="submit" className="btn btn-secondary">
                                            Login
                                        </button>
                                    </form>
                                </>
                            ) : (
                                <>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem'}}>
                                        <h2 style={{color: 'var(--gulf-blue)', fontFamily: "'Racing Sans One', cursive", margin: 0}}>
                                            Manage Accounts
                                        </h2>
                                        <button
                                            onClick={() => {
                                                setIsAuthenticated(false);
                                                setAdminPassword('');
                                                setAccounts([]);
                                            }}
                                            className="btn btn-primary"
                                            style={{padding: '0.5rem 1.5rem', fontSize: '0.9rem'}}
                                        >
                                            Logout
                                        </button>
                                    </div>
                                    <div className="account-list">
                                        {accounts.map(account => (
                                            <div key={account.id} className={`account-item ${editingId === account.id ? 'edit-mode' : ''}`}>
                                                {editingId === account.id ? (
                                                    <div>
                                                        <div className="form-group">
                                                            <label>First Name</label>
                                                            <input
                                                                type="text"
                                                                name="firstName"
                                                                value={formData.firstName}
                                                                onChange={handleInputChange}
                                                            />
                                                        </div>
                                                        <div className="form-group">
                                                            <label>Last Name</label>
                                                            <input
                                                                type="text"
                                                                name="lastName"
                                                                value={formData.lastName}
                                                                onChange={handleInputChange}
                                                            />
                                                        </div>
                                                        <div className="form-group">
                                                            <PhoneInput
                                                                value={formData.phoneNumber}
                                                                onChange={handlePhoneChange}
                                                                country={country}
                                                                onCountryChange={setCountry}
                                                                error={phoneError}
                                                                setError={setPhoneError}
                                                            />
                                                            {phoneError && (
                                                                <div className="field-error">{phoneError}</div>
                                                            )}
                                                        </div>
                                                        <div className="form-group">
                                                            <label>Address</label>
                                                            <AddressAutocomplete
                                                                value={formData.address}
                                                                onChange={(address) => setFormData(prevFormData => ({...prevFormData, address}))}
                                                            />
                                                        </div>
                                                        <div className="form-group">
                                                            <label>Apartment / Unit # (optional)</label>
                                                            <input
                                                                type="text"
                                                                name="apartmentNumber"
                                                                value={formData.apartmentNumber}
                                                                onChange={handleInputChange}
                                                                placeholder="e.g., Apt 4B, Unit 202"
                                                            />
                                                        </div>
                                                        <div className="button-group">
                                                            <button
                                                                onClick={() => updateAccount(account.id)}
                                                                className="btn btn-secondary"
                                                                style={{flex: 1}}
                                                                disabled={phoneError !== null}
                                                            >
                                                                Save
                                                            </button>
                                                            <button
                                                                onClick={cancelEdit}
                                                                className="btn btn-primary"
                                                                style={{flex: 1}}
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div className="account-info">
                                                            <div>
                                                                <div className="info-label">Name</div>
                                                                <div className="info-value">{account.firstName} {account.lastName}</div>
                                                            </div>
                                                            <div>
                                                                <div className="info-label">Phone</div>
                                                                <div className="info-value">{account.phoneNumber}</div>
                                                            </div>
                                                            <div>
                                                                <div className="info-label">Address</div>
                                                                <div className="info-value">
                                                                    {account.address}
                                                                    {account.apartmentNumber && `, ${account.apartmentNumber}`}
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div className="info-label">ID</div>
                                                                <div className="info-value">#{account.id}</div>
                                                            </div>
                                                        </div>
                                                        <div className="button-group">
                                                            <button
                                                                onClick={() => startEdit(account)}
                                                                className="btn btn-secondary"
                                                                style={{flex: 1}}
                                                            >
                                                                Edit
                                                            </button>
                                                            <button
                                                                onClick={() => deleteAccount(account.id)}
                                                                className="btn btn-primary"
                                                                style={{flex: 1}}
                                                            >
                                                                Delete
                                                            </button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                        {accounts.length === 0 && (
                                            <p style={{textAlign: 'center', color: 'var(--gulf-blue)', fontSize: '1.2rem'}}>
                                                No accounts yet. Create one in the other tab!
                                            </p>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
